rules:
  - id: missing-writer-engine-guard
    message: >
      writer_engine.$METHOD() called without a null-guard in $F. Add one at
      function entry on the same reference the call uses ("if not
      writer_engine:" or "if not <instance>.writer_engine:") to prevent
      AttributeError when DB_PASS_WRITER is unset. "is None", a getattr with
      no default or a None one, and the check as one operand of an "or" are
      guards too.
    severity: WARNING
    languages: [python]
    # Reports each writer_engine.<method>() CALL, in any position: a plain
    # expression, "with ... as", "with" with no "as", "async with", "await",
    # inside "def" or "async def". The call is the match, not the function, so
    # one pattern covers every call shape and the guards below are written
    # once per reference form rather than once per call shape (Q-636).
    #
    # A call is guarded when, earlier in an enclosing function, an "if" on the
    # SAME reference tests it for None. The guard forms are listed one by one
    # on purpose. A deep-expression guard (`if <... $REF ...>:`) would also
    # accept `if db.writer_engine.dialect.name == "x":`, `if not
    # writer_engine.url:` and `if not a and not db.writer_engine:`, none of
    # which guards anything. Semgrep matches a flat "or" by position, so each
    # test appears alone, first (`G or $A`), last (`$A or G`) and in the
    # middle (`$A or G or $B`); together those cover an "or" of any length.
    #
    # Each guard sits in a nested formula with `pattern-inside: def $G(...)`.
    # Without it, a module-level `if not writer_engine:` would excuse every
    # function after it, and the pack's convention asks for the guard at
    # function entry, private helpers included. One limit of that scoping: a
    # helper defined INSIDE a guarded function is excused by the outer guard,
    # because `def $G` matches the outer function too. The guard's metavariables
    # still unify with the call's ($OBJ), so a guard on another instance does
    # not excuse the call; a `metavariable-pattern` here would lose that
    # unification, which is why the guards are plain patterns.
    #
    # Each guard form is also accepted as the second or third test of an entry
    # if/elif chain (`if not payload: return 400` / `elif not db.writer_engine:
    # return 503`), the shape a route's entry checks take; `else:` + `if` is
    # the same statement to semgrep. Still reported: the guard as a fourth or
    # later test, and a guard nested in `try`, `with` or a loop — not at
    # function entry, which is what the pack's convention asks for. Semgrep
    # cannot see whether the chain's earlier branches exit, so an `elif` guard
    # after a branch that falls through is accepted, and a call INSIDE an
    # earlier branch of the chain is excused with the rest of the statement.
    #
    # Not reported, knowingly: a call inside the guard's own body (semgrep's
    # `if` region includes it, and creating the engine lazily there is
    # legitimate). A call in the guard's "else" is guarded, and is not
    # reported either. Still reported: a call guarded only
    # by `if <ref> is not None:` around it (the convention is the entry
    # guard), and a getattr whose default is something other than None (the
    # pack's wrong-engine check reports that line too, because Python
    # evaluates the default).
    patterns:
      - pattern-inside: |
          def $F(...):
            ...
      - pattern-either:
          - patterns:
              - pattern: writer_engine.$METHOD(...)
              - pattern-not-inside:
                  patterns:
                    - pattern-inside: |
                        def $G(...):
                          ...
                    - pattern-either:
                      - pattern: |
                          if not writer_engine:
                            ...
                          ...
                      - pattern: |
                          if $PRIOR:
                            ...
                          elif not writer_engine:
                            ...
                          ...
                      - pattern: |
                          if $PRIOR:
                            ...
                          elif $PRIOR2:
                            ...
                          elif not writer_engine:
                            ...
                          ...
                      - pattern: |
                          if $A or not writer_engine:
                            ...
                          ...
                      - pattern: |
                          if $PRIOR:
                            ...
                          elif $A or not writer_engine:
                            ...
                          ...
                      - pattern: |
                          if $PRIOR:
                            ...
                          elif $PRIOR2:
                            ...
                          elif $A or not writer_engine:
                            ...
                          ...
                      - pattern: |
                          if not writer_engine or $A:
                            ...
                          ...
                      - pattern: |
                          if $PRIOR:
                            ...
                          elif not writer_engine or $A:
                            ...
                          ...
                      - pattern: |
                          if $PRIOR:
                            ...
                          elif $PRIOR2:
                            ...
                          elif not writer_engine or $A:
                            ...
                          ...
                      - pattern: |
                          if $A or not writer_engine or $B:
                            ...
                          ...
                      - pattern: |
                          if $PRIOR:
                            ...
                          elif $A or not writer_engine or $B:
                            ...
                          ...
                      - pattern: |
                          if $PRIOR:
                            ...
                          elif $PRIOR2:
                            ...
                          elif $A or not writer_engine or $B:
                            ...
                          ...
                      - pattern: |
                          if writer_engine is None:
                            ...
                          ...
                      - pattern: |
                          if $PRIOR:
                            ...
                          elif writer_engine is None:
                            ...
                          ...
                      - pattern: |
