rules:
  - id: llm-cost-abuse
    message: >
      GenerateContentConfig(...) without max_output_tokens, or with
      max_output_tokens=None. LLM output is unbounded — a crafted query can
      inflate per-request cost. Set an explicit limit (2048 for JSON
      configs, 4096 for prose, 8192 for long-form).
    severity: ERROR
    languages: [python]
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: types.GenerateContentConfig(...)
              - pattern: GenerateContentConfig(...)
          - pattern-not: types.GenerateContentConfig(..., max_output_tokens=..., ...)
          - pattern-not: GenerateContentConfig(..., max_output_tokens=..., ...)
      - pattern: types.GenerateContentConfig(..., max_output_tokens=None, ...)
      - pattern: GenerateContentConfig(..., max_output_tokens=None, ...)
