# Sysop model roles — the single source of truth for "which model does what."
#
# Skills do not hard-pin a model name. They pin a ROLE (see the `<!-- sysop:model-roles … -->`
# marker at the top of each SKILL.md). At install/update time, sysop/scripts/resolve_skill_models.py
# rewrites every marked `model:` value to the model this file maps the role to. So swapping
# the model behind a role — a sunset, a cost trade, a better model shipping — is a one-line
# edit here, not a sweep across the skills tree.
#
# ── roles ─────────────────────────────────────────────────────────────────────
# reasoning  — deep/adversarial/audit/judge work + review-skill frontmatter.
#              Worth full reasoning depth; cost is secondary.
# mechanical — prescriptive, scoped fix agents (e.g. /auto-fix). Pinned, not
#              inherited, so cost is deterministic regardless of the session model.
# quick      — trivial read-only surveys (e.g. /next-task). Latency over depth.
# convention-gate
#            — /review-close Step 2b's convention agent, and the Step 4 `4a-fix`
#              re-check of the close's own fix commit (Phase 328), which is a
#              convention gate over new hunks. Nothing else. Split out
#              of `reasoning` (Phase 262) so its model can be chosen separately from
#              the security twin beside it, which stays on `reasoning`. The 2b
#              agent is the deep spawn that runs on EVERY target of every close — the security
#              twin beside it is gated on a security-map glob and skips most
#              targets on a stock install — so it is the one a consumer is most
#              likely to want cheaper on its own.
#
#              Its value is the ROLE NAME `reasoning`, not a model: a role may name
#              another role and resolves to whatever that role resolves to. So it
#              FOLLOWS your `reasoning` choice by default — if you set
#              `reasoning: sonnet`, this moves with it — and a `convention-gate:`
#              key of your own wins over that. A literal `opus` here would instead
#              have silently RAISED this pin back to opus, on update, for exactly
#              the consumers who had chosen the cheap lever.
# planner    — the plan-only agent: /claim-task Step 7a, /auto-build Phase 6a.
# plan-review
#            — the adversarial reviewer of that plan: /claim-task Step 7b,
#              /auto-build Phase 6b, and `_shared/adversarial-review.md`'s caller
#              contract, which /plan-review also follows.
# executor   — the agent that implements a reviewed plan: /claim-task Step 7e,
#              /auto-build Phase 6e.
#
#              These three were one `reasoning` pin until Phase 349, so moving
#              execution moved review with it. Each names `reasoning` and follows
#              it, exactly as `convention-gate` does, so a default install is
#              unchanged. The one a consumer is likely to move is `executor`: it
#              is where the spend concentrates, and it works from a plan that was
#              already adversarially reviewed. A cheaper executor is also a
#              different model from the reasoning-tier code review at
#              /review-close — the independence `_shared/adversarial-review.md`
#              asks for. Set its effort too — see "Effort" below.
#
# Every skill carries a pin. Four were un-pinned and rode the session model until
# Phase 349 — /document-work and /triage (now `reasoning`), /sitrep (`quick`) and
# /auto-fix's orchestrator (`mechanical`) — which on a session running a model
# priced above `reasoning` made checklist work the most expensive work in the tree.
# /triage is `reasoning`, not a cheaper tier, because /auto-judge invokes it mid-turn
# and a skill's frontmatter model holds for the rest of that turn (per the Claude Code
# docs; not measured here). The cost runs the other way for /auto-fix, which also
# invokes it: after an untriaged batch, /auto-fix's orchestrator finishes that turn on
# the reasoning model (its fix agents keep their own `mechanical` pin).
roles:
  reasoning:  opus
  mechanical: sonnet
  quick:      haiku
  convention-gate: reasoning   # follows `reasoning` unless you override it
  planner:         reasoning
  plan-review:     reasoning
  executor:        reasoning

# ── served ────────────────────────────────────────────────────────────────────
# The models the roles above are allowed to resolve to. sysop/scripts/check_skill_models.py
# fails (exit 1) if any role resolves to a model NOT listed here — that is what turns a
# sunset LOUD instead of silent. On a sunset: change the role's model above AND this list
# in the same edit, then re-run check_skill_models.py to confirm green.
served:
  - opus
  - sonnet
  - haiku
  - fable    # served but unmapped by default — remap a role to it in
             # served_models.local.yml (see below). Pre-listed here so that
             # override stays one key AND still goes loud if fable is ever
             # dropped from this list on a sunset.

# ── inline_models ─────────────────────────────────────────────────────────────
# The values an INLINE pin may resolve to. A skill's frontmatter `model:` and a
# skill BODY's `model: "<x>"` are not the same surface, and they do not accept the
# same values:
#
#   * frontmatter — becomes the skill's own `model:` field, which accepts what
#     `/model` accepts: aliases, full model ids, and meta-values like `best`.
#     An unrecognized value there falls back to the session model.
#   * inline — the agent copies the value into the Agent tool's `model`
#     parameter, which is a CLOSED ENUM. `best`, `inherit`, and full model ids
#     are each rejected with InputValidationError at spawn time (verified by
#     making the calls, 2026-08-21). The failure lands mid-skill, at spawn time,
#     in every skill the role governs — 17 inline pins today, 5 of them on the
#     `reasoning` role, 9 on the three roles that follow it (`planner`,
#     `plan-review`, `executor`), 2 on `convention-gate` and 1 on `mechanical`.
#     `check_skill_models.py --list` prints the live set.
#
# check_skill_models.py fails (exit 1) when a role governing an inline pin
# resolves to a value not listed here. If your harness accepts more, extend this
# list in served_models.local.yml rather than editing this file.
inline_models:
  - opus
  - sonnet
  - haiku
  - fable

# ── overriding for your project (without losing sunset updates) ────────────────
# This file is Sysop-owned: `sysop-update.sh` overwrites it so sunset fixes keep flowing.
# Do NOT edit the roles above to pick your own models — your edits would be clobbered.
# Instead create `.claude/served_models.local.yml` with just the keys you want to change.
# The common case is one key — e.g. run the deep-reasoning skills on Claude Fable 5
# (`fable` is already in `served:` AND `inline_models:` above, so no additions are
# needed; the harness needs Claude Code >= 2.1.170 for fable, and where a pinned model
# is unavailable the session silently keeps its current model):
#
#     roles:
#       reasoning: fable
#
# Every role except `quick` governs inline pins, so map each of them —
# `reasoning`, `mechanical`, `convention-gate`, `planner`, `plan-review`, `executor` —
# to one of the four aliases above, or to the name of another role (as the defaults
# for the last four do).
# Mapping any of them to `best`, `inherit`, `opusplan`, a full model id, or a
# provider-specific id BREAKS every agent spawn in the skills that role governs — adding
# the value to `served:` does not help, because `served:` is Sysop's sunset allowlist and
# not the harness's enum. `quick` governs only frontmatter today and is not so constrained,
# but that is a property of the current pin set, not a promise.
#
# For a value outside the default lists: always extend `served:`, and extend
# `inline_models:` as well if the role governs any inline pin. The example below needs
# only `served:`, because `quick` is frontmatter-only:
#
#     roles:
#       quick: inherit               # frontmatter-only role: `inherit` follows the session
#     served:
#       - inherit                    # list EVERY non-default value you map a role to —
#                                    #   check_skill_models.py requires each role to
#                                    #   resolve to a served entry, with no exemptions.
#
# Effort. A role picks a MODEL, not a reasoning effort, and the Agent tool has no
# effort parameter. Save a level for the model under `modelSettings` in your Claude
# Code settings: one consumer measured each spawned executor running at its own
# model's saved level (and at the model's default, `medium` for Sonnet 5.5, when none
# was saved), while the docs say a subagent's effort defaults to the session's — so
# save one rather than rely on either, and read the level off the transcript. Moving
# `executor` to a cheaper model is two settings, not one — and a saved effort level
# is read at session start:
#
#     roles:
#       executor: sonnet             # in served_models.local.yml
#
#     "modelSettings": { "claude-sonnet-5-5": { "effortLevel": "high" } }
#                                    # in ~/.claude/settings.json, or the project's
#
# One consumer's A/B of Sonnet 5.5 against Opus 5.5 as executor, on two reviewed
# plans (a Low and a Medium task), found the same design at every site at about
# two-fifths of the tokens-at-list-price at `high` (a third at `medium`) — and one
# departure from the plan at `medium`, on the cross-module task, that `high` closed.
#
# The local file is never overwritten and layers on top (local keys win).
#
# On non-Claude models: the role indirection itself does not constrain a value to Claude —
# only the default mapping above happens to be Claude — but that seam is real for
# FRONTMATTER pins and not for inline ones. A full model id or a provider-specific id
# (Bedrock ARN, Vertex name) resolves fine in frontmatter and is rejected by the inline
# enum, so a role governing an inline pin cannot carry one today.
