# Sysop model roles — the single source of truth for "which model does what."
#
# Skills do not hard-pin a model name. They pin a ROLE (see the `<!-- sysop:model-roles … -->`
# marker at the top of each SKILL.md). At install/update time, sysop/scripts/resolve_skill_models.py
# rewrites every marked `model:` value to the model this file maps the role to. So swapping
# the model behind a role — a sunset, a cost trade, a better model shipping — is a one-line
# edit here, not a sweep across the skills tree.
#
# ── roles ─────────────────────────────────────────────────────────────────────
# reasoning  — deep/adversarial/audit/judge work + review-skill frontmatter.
#              Worth full reasoning depth; cost is secondary.
# mechanical — prescriptive, scoped fix agents (e.g. /auto-fix). Pinned, not
#              inherited, so cost is deterministic regardless of the session model.
# quick      — trivial read-only surveys (e.g. /next-task). Latency over depth.
#
# Skills that carry no pin (and no marker) inherit the session model. That is
# deliberate — roles govern pinned skills only; an un-pinned skill rides whatever
# model the human picked for the session.
roles:
  reasoning:  opus
  mechanical: sonnet
  quick:      haiku

# ── served ────────────────────────────────────────────────────────────────────
# The models the roles above are allowed to resolve to. sysop/scripts/check_skill_models.py
# fails (exit 1) if any role resolves to a model NOT listed here — that is what turns a
# sunset LOUD instead of silent. On a sunset: change the role's model above AND this list
# in the same edit, then re-run check_skill_models.py to confirm green.
served:
  - opus
  - sonnet
  - haiku
  - fable    # served but unmapped by default — remap a role to it in
             # served_models.local.yml (see below). Pre-listed here so that
             # override stays one key AND still goes loud if fable is ever
             # dropped from this list on a sunset.

# ── inline_models ─────────────────────────────────────────────────────────────
# The values an INLINE pin may resolve to. A skill's frontmatter `model:` and a
# skill BODY's `model: "<x>"` are not the same surface, and they do not accept the
# same values:
#
#   * frontmatter — becomes the skill's own `model:` field, which accepts what
#     `/model` accepts: aliases, full model ids, and meta-values like `best`.
#     An unrecognized value there falls back to the session model.
#   * inline — the agent copies the value into the Agent tool's `model`
#     parameter, which is a CLOSED ENUM. `best`, `inherit`, and full model ids
#     are each rejected with InputValidationError at spawn time (verified by
#     making the calls, 2026-08-21). The failure lands mid-skill, at spawn time,
#     in every skill the role governs — 13 inline pins today, 12 of them on the
#     `reasoning` role.
#
# check_skill_models.py fails (exit 1) when a role governing an inline pin
# resolves to a value not listed here. If your harness accepts more, extend this
# list in served_models.local.yml rather than editing this file.
inline_models:
  - opus
  - sonnet
  - haiku
  - fable

# ── overriding for your project (without losing sunset updates) ────────────────
# This file is Sysop-owned: `sysop-update.sh` overwrites it so sunset fixes keep flowing.
# Do NOT edit the roles above to pick your own models — your edits would be clobbered.
# Instead create `.claude/served_models.local.yml` with just the keys you want to change.
# The common case is one key — e.g. run the deep-reasoning skills on Claude Fable 5
# (`fable` is already in `served:` AND `inline_models:` above, so no additions are
# needed; the harness needs Claude Code >= 2.1.170 for fable, and where a pinned model
# is unavailable the session silently keeps its current model):
#
#     roles:
#       reasoning: fable
#
# `reasoning` and `mechanical` both govern inline pins, so map them to one of the four
# aliases above. Mapping either to `best`, `inherit`, `opusplan`, a full model id, or a
# provider-specific id BREAKS every agent spawn in the skills that role governs — adding
# the value to `served:` does not help, because `served:` is Sysop's sunset allowlist and
# not the harness's enum. `quick` governs only frontmatter today and is not so constrained,
# but that is a property of the current pin set, not a promise.
#
# For a value outside the default lists: always extend `served:`, and extend
# `inline_models:` as well if the role governs any inline pin. The example below needs
# only `served:`, because `quick` is frontmatter-only:
#
#     roles:
#       quick: inherit               # frontmatter-only role: `inherit` follows the session
#     served:
#       - inherit                    # list EVERY non-default value you map a role to —
#                                    #   check_skill_models.py requires each role to
#                                    #   resolve to a served entry, with no exemptions.
#
# The local file is never overwritten and layers on top (local keys win).
#
# On non-Claude models: the role indirection itself does not constrain a value to Claude —
# only the default mapping above happens to be Claude — but that seam is real for
# FRONTMATTER pins and not for inline ones. A full model id or a provider-specific id
# (Bedrock ARN, Vertex name) resolves fine in frontmatter and is rejected by the inline
# enum, so a role governing an inline pin cannot carry one today.
